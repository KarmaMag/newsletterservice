[project]
name = "newsletter-agent"
version = "1.0.0"
description = "Self-hosted newsletter service with a Mailchimp importer and an AI agent layer (MCP + Mistral CLI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic[email]>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
